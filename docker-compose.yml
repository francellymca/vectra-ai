
name: vectra-ai

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vectra-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - vectra-network

  n8n:
    image: n8nio/n8n:latest
    container_name: vectra-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}

      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docs/pdf/knowledge:/files:ro
    depends_on:
      - qdrant
    networks:
      - vectra-network

volumes:
  n8n_data:
  qdrant_storage:

networks:
  vectra-network:
    driver: bridge